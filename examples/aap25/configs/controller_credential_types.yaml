---
controller_credential_types:
  - name: Kubeconfig
    description: !unsafe
    kind: cloud
    inputs:
      fields:
        - id: kube_config
          type: string
          label: kubeconfig
          secret: true
          multiline: true
      required:
        - kube_config
    injectors:
      env:
        K8S_AUTH_KUBECONFIG: !unsafe '{{ tower.filename.kubeconfig }}'
      file:
        template.kubeconfig: !unsafe '{{ kube_config }}'
  - name: REST API Credential
    description: !unsafe REST API Credential
    kind: cloud
    inputs:
      fields:
        - id: rest_username
          type: string
          label: REST Username
        - id: rest_password
          type: string
          label: REST Password
          secret: true
      required:
        - rest_username
        - rest_password
    injectors:
      env:
        rest_password_env: !unsafe '{{ rest_password }}'
        rest_username_env: !unsafe '{{ rest_username }}'
      extra_vars:
        rest_password: !unsafe '{{ rest_password }}'
        rest_username: !unsafe '{{ rest_username }}'
...
