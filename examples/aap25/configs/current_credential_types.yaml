---
controller_credential_types:
  - name: "Kubeconfig"
    description: ""
    kind: "cloud"
    inputs:
      fields:
      - id: kube_config
        type: string
        label: kubeconfig
        secret: true
        multiline: true
      required:
      - kube_config

    injectors:
      env:
        K8S_AUTH_KUBECONFIG: !unsafe '{{ tower.filename.kubeconfig }}'
      file:
        template.kubeconfig: !unsafe '{{ kube_config }}'
...
